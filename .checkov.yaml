# Checkov configuration file
# This file configures security scanning for Terraform code

skip-checks:
  # Skip CKV_GCP_14: Ensure roles do not impersonate or manage Service Accounts used at project level
  # Reason: The service account user role is now disabled by default and only enabled if explicitly needed.
  # When enabled, it's documented as dangerous and should be used with caution.
  - CKV_GCP_14
  # Skip CKV_GCP_49: Ensure roles do not impersonate or manage Service Accounts used at project level
  # Reason: Cloud Build editor role is required for CI/CD pipeline to build and push containers.
  # The service account is restricted to specific operations and monitored.
  - CKV_GCP_49

# Additional checkov settings can be added here
framework:
  - terraform