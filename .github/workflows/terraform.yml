name: '🏗️ Deploy Infrastructure'

on:
  pull_request:
    paths: 
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths: 
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

# Grant permissions for OIDC authentication
permissions:
  contents: 'read'
  id-token: 'write'
  pull-requests: 'write'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: flight-delay-api
  REGION: us-central1

