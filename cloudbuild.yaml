steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/$_SERVICE_NAME', '.']
  
  # Verify data file exists in the image
  - name: 'gcr.io/$PROJECT_ID/$_SERVICE_NAME'
    entrypoint: 'sh'
    args: 
      - '-c'
      - |
        echo "Checking if data.csv exists..."
        ls -la data/data.csv && echo "✅ data.csv found" || (echo "❌ data.csv missing!" && exit 1)
        echo "Checking if model exists..."
        ls -la models/delay_model.pkl && echo "✅ Model found" || echo "⚠️ Model not found (will be created during startup)"

images:
  - 'gcr.io/$PROJECT_ID/$_SERVICE_NAME'

substitutions:
  _SERVICE_NAME: flight-delay-api